name: Build PLINOS VISUALS

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and build project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          SETTINGS=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project found: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PLINOS-VISUALS-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
